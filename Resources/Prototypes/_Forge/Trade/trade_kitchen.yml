# Forge: kitchen trade machine (contracts + ingredient shop).

# ----------------------------
# Профиль и сам торгомат
# ----------------------------
- type: ncStoreProfile
  id: TrademachineKitchenProfile
  buy:
  - kitchen_buy
  contracts: N14KitchenContracts
  theme: TradeUiThemeWasteland

- type: entity
  id: TrademachineKitchen
  parent: Trademachine
  name: Кухонный торгомат
  description: Торговый автомат для поваров и добытчиков. Принимает заказы на готовую еду и продаёт кухонные ресурсы.
  suffix: vendor, Kitchen
  components:
  - type: NcStore
    profile: TrademachineKitchenProfile
  - type: Sprite
    sprite: Structures/Machines/VendingMachines/chefvend.rsi
    layers:
    - state: off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: normal-unshaded
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded

