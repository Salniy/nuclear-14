# ----------------------------
# Контракты
# ----------------------------
- type: storeContractsPreset
  id: N14KitchenContracts
  skipCost: 0
  contractOffers:
    maxVisible: 8
    groups:
    - pool: N14KitchenStandingOrders
      minVisible: 1
      maxVisible: 1
      fillWeight: 1
    - pool: N14KitchenDishOrders
      minVisible: 4
      maxVisible: 6
      fillWeight: 5

- type: ncContractOfferPool
  id: N14KitchenStandingOrders
  name: "Постоянные заказы кухни"
  order: 5
  color: "#C9A45A"
  entries:
  - type: Supply
    id: N14KitchenSupplyRation
    weight: 1

- type: ncContractOfferPool
  id: N14KitchenDishOrders
  name: "Заказы на блюда"
